<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="form">
        <input type="text" placeholder="введите имя" name="asd" id="1">
        <input type="text" placeholder="введите город" name="asdfasd" id="2">
        <button type="submit">отправить данные</button>
    </form>
</body>
<script>
    const API_URL = "http://localhost:3000/people"

    const nameInput = document.querySelector('#1')
    const cutyInput = document.querySelector('#2')
    const form = document.querySelector('#form')

    form.addEventListener('submit', async (event) =>{

        event.preventDefault()
        const newHuman = {
            name: nameInput.value.trim(),
            city: cutyInput.value.trim(),
        }
        const response = await fetch(API_URL,{
            method:'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(newHuman)
        })
        console.log("соси" + await response.json())
    })
</script>
</html>
